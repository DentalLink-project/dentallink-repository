<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="치과 예약을 쉽고 빠르게. 안전한 예약 플랫폼 Dentallink">
    <title>Dentallink - 상담원 관리</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin-chat.css">
    <script src="/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/admin-chat.js"></script>
</head>
<body>
<!--공통 header 부분입니다. -->
<header>
    <div class="logo-wrapper">
        <a href="/" class="logo">DentalLink</a>
    </div>
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="지역, 병원장 명, 병원명 검색" id="searchInput">
    </div>
    <div class="auth-buttons">
        <button class="btn-login" id="loginBtn">로그인/가입</button>
        <button class="btn-login logout" id="logoutBtn" style="display: none;">로그아웃</button>
    </div>
</header>

<!-- Message Box -->
<div id="messageBox"></div>

<main>
    <aside>
        <nav>
            <ul>
                <li><a href="/">🏥 병원 찾기</a></li>
                <li><a href="/my-reservations">📋 내 예약 보기</a></li>
                <li><a href="/my-page">💖 내 정보 보기</a></li>
                <li><a href="/chatbot">💬 채팅</a></li>
                <li id="adminChatMenu" style="display: block;"><a href="/admin-chat.html" class="active">👥 상담원 관리</a></li>
            </ul>
        </nav>
    </aside>
    <section class="admin-chat-container">
        <!-- 좌측: 대기 중인 세션 목록 -->
        <div class="waiting-sessions-panel">
            <div class="panel-header">
                <h2>대기 중인 사용자</h2>
                <span class="waiting-count" id="waitingCount">0</span>
            </div>
            <div class="session-list" id="sessionList">
                <div class="empty-state">
                    <div class="empty-state-icon">👥</div>
                    <div class="empty-state-text">대기 중인 사용자가 없습니다.</div>
                </div>
            </div>
        </div>

        <!-- 우측: 채팅 인터페이스 -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-info">
                    <h2 class="chat-user-name" id="chatUserName">사용자 선택</h2>
                    <span class="chat-status" id="chatStatus">대기 중</span>
                </div>
                <button class="btn-close-session" id="closeSessionBtn" style="display: none;">상담 종료</button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">
                        대기 중인 사용자를 선택하여<br>상담을 시작하세요.
                    </div>
                </div>
            </div>

            <div class="chat-input-container" id="chatInputContainer" style="display: none;">
                <div class="input-wrapper">
                    <textarea
                            class="chat-input"
                            id="chatInput"
                            placeholder="메시지를 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"
                            maxlength="2000"
                            rows="1"
                    ></textarea>
                    <div class="input-footer">
                        <span class="char-count" id="charCount">0/2000</span>
                        <button class="send-btn" id="sendBtn" onclick="sendConsultantMessage()">
                            전송
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Login Modal -->
<div class="modal" id="loginModal">
    <div class="modal-content" style="position: relative;">
        <button class="close-modal" onclick="closeLoginModal()">×</button>
        <h2 class="modal-header">로그인</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-input" id="loginEmail" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-input" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-primary">로그인</button>
        </form>
        <div class="modal-footer">
            아직 회원이 아니신가요? <a href="#" onclick="showSignupModal()">회원가입</a>
        </div>
    </div>
</div>

<!-- Signup Modal -->
<div class="modal" id="signupModal">
    <div class="modal-content" style="position: relative;">
        <button class="close-modal" onclick="closeSignupModal()">×</button>
        <h2 class="modal-header">회원가입</h2>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-input" id="signupEmail" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">사용자 이름</label>
                <input type="text" class="form-input" id="signupUsername" required placeholder="홍길동">
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-input" id="signupPassword" required
                       placeholder="영대/소문자, 숫자, 특수문자 포함">
                <small style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
                    영어 대/소문자, 숫자, 특수문자를 모두 포함해야 합니다.
                </small>
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호 확인</label>
                <input type="password" class="form-input" id="signupPasswordConfirm" required>
            </div>
            <button type="submit" class="btn-primary">가입하기</button>
        </form>
        <div class="modal-footer">
            이미 계정이 있으신가요? <a href="#" onclick="showLoginModal()">로그인</a>
        </div>
    </div>
</div>

<!-- Floating Menu (Mobile) -->
<div class="floating-menu" id="floatingMenu">
    <div class="floating-items" id="floatingItems">
        <div class="floating-item">
            🏥 병원 찾기
        </div>
        <div class="floating-item">
            📋 내 예약 보기
        </div>
        <div class="floating-item">
            💰 포인트
        </div>
        <div class="floating-item">
            💬 채팅
        </div>
    </div>
    <button class="floating-toggle" id="floatingToggle">
        ☰
    </button>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalLink - 병원 상세</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/hospital.css">
    <script src="/js/common.js"></script>
    <script src="/js/hospital.js"></script>
</head>
<body>
<!-- Message Box -->
<div id="messageBox"></div>

<!-- Header -->
<header>
    <div class="logo-wrapper">
        <a href="/" class="logo">DentalLink</a>
    </div>
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="지역, 병원장 명, 병원명 검색" id="searchInput">
    </div>
    <div class="auth-buttons">
        <button class="btn-login" id="loginBtn">로그인/가입</button>
        <button class="btn-login logout" id="logoutBtn" style="display: none;">로그아웃</button>
    </div>
</header>

<main>
    <!-- Left Sidebar -->
    <aside>
        <nav>
            <ul>
                <li><a href="/" class="active">🏥 병원 찾기</a></li>
                <li><a href="/my-reservations">📋 내 예약 보기</a></li>
                <li><a href="/my-page">💖 내 정보 보기</a></li>
                <li><a href="/chatbot">💬 채팅</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <section>
        <article class="hospital-detail-container">
            <!-- JavaScript로 템플릿 채움 -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>병원 정보를 불러오는 중...</p>
            </div>
        </article>
    </section>
</main>

<!-- Login Modal -->
<div class="modal" id="loginModal">
    <div class="modal-content" style="position: relative;">
        <button class="close-modal" onclick="closeLoginModal()">×</button>
        <h2 class="modal-header">로그인</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-input" id="loginEmail" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-input" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-primary">로그인</button>
        </form>
        <div class="modal-footer">
            아직 회원이 아니신가요? <a href="#" onclick="showSignupModal()">회원가입</a>
        </div>
    </div>
</div>

<!-- Signup Modal -->
<div class="modal" id="signupModal">
    <div class="modal-content" style="position: relative;">
        <button class="close-modal" onclick="closeSignupModal()">×</button>
        <h2 class="modal-header">회원가입</h2>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-input" id="signupEmail" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">사용자 이름</label>
                <input type="text" class="form-input" id="signupUsername" required placeholder="홍길동">
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-input" id="signupPassword" required
                       placeholder="영대/소문자, 숫자, 특수문자 포함">
                <small style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
                    영어 대/소문자, 숫자, 특수문자를 모두 포함해야 합니다.
                </small>
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호 확인</label>
                <input type="password" class="form-input" id="signupPasswordConfirm" required>
            </div>
            <button type="submit" class="btn-primary">가입하기</button>
        </form>
        <div class="modal-footer">
            이미 계정이 있으신가요? <a href="#" onclick="showLoginModal()">로그인</a>
        </div>
    </div>
</div>

<!-- Review Modal -->
<div class="modal" id="reviewModal">
    <div class="modal-content review-modal-content">
        <button class="close-modal" onclick="closeReviewModal()">×</button>
        <h2 class="modal-header">리뷰 작성</h2>
        <form id="reviewForm" onsubmit="submitReview(event)">
            <div class="form-group">
                <label class="form-label">별점</label>
                <div class="star-rating" id="starRating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <input type="hidden" id="reviewPoint" name="point" required>
            </div>
            <div class="form-group">
                <label class="form-label">리뷰 내용</label>
                <textarea class="review-textarea" id="reviewContent" name="content"
                          rows="6" required placeholder="병원 이용 후기를 작성해주세요."></textarea>
            </div>
            <button type="submit" class="btn-submit-review">리뷰 등록</button>
        </form>
    </div>
</div>

<!-- Floating Menu (Mobile) -->
<div class="floating-menu" id="floatingMenu">
    <div class="floating-items" id="floatingItems">
        <a href="/" class="floating-item">🏥 병원 찾기</a>
        <a href="#" class="floating-item">📋 내 예약 보기</a>
        <a href="#" class="floating-item">💰 포인트</a>
        <a href="/chatbot" class="floating-item">💬 채팅</a>
    </div>
    <button class="floating-toggle" id="floatingToggle">☰</button>
</div>
</body>
</html>

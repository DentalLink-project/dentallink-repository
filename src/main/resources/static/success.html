<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>결제 승인 중...</title>
</head>
<body>
<h2>결제 승인 중...</h2>
<p id="paymentKey"></p>
<p id="orderId"></p>
<p id="amount"></p>
<p id="status"></p>

<script>
    // Toss에서 전달된 쿼리 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get("paymentKey");
    const orderId = urlParams.get("orderId");
    const amount = parseInt(urlParams.get("amount"));

    // Postman에서 테스트용 JWT 직접 입력
    const token = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJzb21lb25lQGV4YW1wbGUuY29tIiwiYXV0aCI6IlJPTEVfVVNFUiIsImV4cCI6MTc2MTg5NTg0OSwiaWF0IjoxNzYxODkyMjQ5fQ.kf7EHfpwQEbIs-AJzlYL3sfk5OBNOawHH8sv4mRufK0";
    async function confirmPayment() {
        try {
            const response = await fetch("http://localhost:8080/api/payments/confirm", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}` // 이 형식만 인식됨
                },
                body: JSON.stringify({
                    paymentKey: paymentKey,
                    orderId: orderId,
                    amount: amount,
                }),
            });

            const json = await response.json();

            if (!response.ok) {
                document.getElementById("status").textContent = "결제 승인 실패";
                console.error("결제 승인 실패:", json);
                alert("결제 승인 실패: " + (json.message || "오류 발생"));
                return;
            }

            document.getElementById("status").textContent = "결제 승인 완료!";
            console.log("결제 승인 성공:", json);
        } catch (error) {
            console.error("서버 통신 오류:", error);
            document.getElementById("status").textContent = "네트워크 오류 발생";
        }
    }

    confirmPayment(); // 페이지 로드 시 자동 실행

    document.getElementById("paymentKey").textContent = "paymentKey: " + paymentKey;
    document.getElementById("orderId").textContent = "주문번호: " + orderId;
    document.getElementById("amount").textContent = "결제 금액: " + amount + "원";
</script>
</body>
</html>

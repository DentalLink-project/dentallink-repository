spring:
  config:
    import:
      - "optional:aws-parameterstore:/config/dev/"

  cloud:
    aws:
      region:
        static: ap-northeast-2  # ⭐ 여기에 직접 추가!

  datasource:
    url: ${db.url:jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.name:dentallink}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${db.username:root}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${hibernate.ddl-auto:create}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

jwt:
  secret:
    key: ${secret.key}

server:
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    display-request-duration: true
    tryItOutEnabled: true
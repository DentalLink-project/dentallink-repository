spring:
  # AWS Parameter Store는 프로덕션용 - 로컬 개발 시에는 주석 처리
  # config:
  #   import:
  #     - "optional:aws-parameterstore:/config/dev/"

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

  datasource:
    # 환경 변수 필수! 기본값 없음 (보안)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:devdb}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}  # ⭐ 기본값 없음 - 환경 변수 필수!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

# JWT 설정
jwt:
  secret:
    key: ${JWT_SECRET_KEY}  # ⭐ 기본값 없음 - Base64 인코딩된 키 필수!
  expiration: ${JWT_EXPIRATION:86400000}  # 24시간

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    display-request-duration: true
    tryItOutEnabled: true
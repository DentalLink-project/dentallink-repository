spring:
  config:
    import:
      - "optional:aws-parameterstore:/config/dev/"

  cloud:
    aws:
      region:
        static: ap-northeast-2

  datasource:
    url: ${db.url:jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.name:dentallink}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${db.username:root}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${redis.host:redis}
      port: ${redis.port:6379}

  jpa:
    hibernate:
      ddl-auto: ${hibernate.ddl-auto:create}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

jwt:
  secret:
    key: ${secret.key}
  access-token-expiration: ${access.token.expiration:3600000}       # AccessToken의 만료 시간은 1시간 입니다.
  refresh-token-expiration: ${refresh.token.expiration:1209600000}  # RefreshToken의 만료 시간은 2주 입니다.

gemini:
  api-key: ${gemini.api.key}          # Parameter Store에서 로드
  model-name: gemini-2.0-flash        # gemini.modelName
  max-tokens: 2048                     # gemini.maxTokens
  temperature: 0.7                     # gemini.temperature (창의성 0.0~1.0)
  top-p: 0.95                          # gemini.topP
  top-k: 40                            # gemini.topK
  timeout: 30                          # gemini.timeout (API 타임아웃 초)

  # Rate Limit 설정 (Gemini 무료 티어)
  rate-limit:
    per-minute: 15                     # 전체 분당 최대 15회
    per-user-per-minute: 10            # 사용자당 분당 10회
    per-day: 1500                      # 일일 최대 1500회

# 챗봇 기능 활성화
chatbot:
  enabled: true

server:
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    display-request-duration: true
    tryItOutEnabled: true

kakao:
  auth:
    client: f3f8992349ba97fdaa5f775e0b5d7d11
    redirect: http://localhost:8080/api/auth/login/kakao


toss:
  secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus" #외부로 노출할 엔드포인트 목록 (기본 : health, Info)
  endpoint:
    health:
      show-details: always #헬스 상태를 자세히 보여줄지 여부
  metrics:
    tags:
      application: spring-app #모든 메트릭에 공통으로 붙는 태그 설정

# 로그 레벨 설정
logging:
  level:
    root: INFO
    com.dentallink: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

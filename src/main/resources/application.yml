spring:
  config:
    import:
      - "optional:aws-parameterstore:/config/dev/"

  cloud:
    aws:
      region:
        static: ap-northeast-2

  datasource:
    url: ${db.url:jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.name:dentallink}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${db.username:root}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${redis.host:redis}
      port: ${redis.port:6379}

  jpa:
    hibernate:
      ddl-auto: ${hibernate.ddl-auto:create}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

jwt:
  secret:
    key: ${secret.key}

gemini:
  api-key: ${gemini.api.key}          # Parameter Store에서 로드
  model-name: gemini-2.0-flash        # gemini.modelName
  max-tokens: 2048                     # gemini.maxTokens
  temperature: 0.7                     # gemini.temperature (창의성 0.0~1.0)
  top-p: 0.95                          # gemini.topP
  top-k: 40                            # gemini.topK
  timeout: 30                          # gemini.timeout (API 타임아웃 초)

  # Rate Limit 설정 (Gemini 무료 티어)
  rate-limit:
    per-minute: 15                     # 전체 분당 최대 15회
    per-user-per-minute: 10            # 사용자당 분당 10회
    per-day: 1500                      # 일일 최대 1500회

# 챗봇 기능 활성화
chatbot:
  enabled: true

server:
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    display-request-duration: true
    tryItOutEnabled: true



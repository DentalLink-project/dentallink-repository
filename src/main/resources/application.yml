spring:
  # AWS Parameter Store는 프로덕션용 - 개발 시에는 주석 처리
  # config:
  #   import:
  #     - "optional:aws-parameterstore:/config/dev/"

  cloud:
    aws:
      region:
        static: ap-northeast-2

  datasource:
    # RDS 연결 (dev-rds-mysql)
    url: jdbc:mysql://dev-rds-mysql.c3g4uqiy0c1r.ap-northeast-2.rds.amazonaws.com:3306/devdb?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: admin
    password: ${DB_PASSWORD:your-rds-master-password}  # 환경 변수 또는 직접 입력
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # create에서 update로 변경 (데이터 보존)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

# JWT 설정 - 순환 참조 해결
jwt:
  secret:
    # 개발용 키 (프로덕션에서는 환경 변수 사용!)
    key: ${JWT_SECRET_KEY:devSecretKeyForLocalDevelopmentOnlyMin256BitsHS256Algorithm123456789012345678901234567890}
  expiration: 86400000  # 24시간 (밀리초)

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    display-request-duration: true
    tryItOutEnabled: true